name: Build Windows App & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag della Release GitHub (es. v1.02)"
        required: false
        default: "v1.02"

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    name: Compila App Windows & Pubblica Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configura Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compila distribuzione Windows (Exe installer e Portable app-image)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & gradle -p desktop packageDistributionForCurrentOS createDistributable --no-daemon 2>&1 | Tee-Object -FilePath "$env:TEMP\gradle-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $distDir = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $distDir | Out-Null

          $installer = Get-ChildItem -Path "desktop/build/compose/binaries/main/exe" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE non trovato in desktop/build/compose/binaries/main/exe" }
          Copy-Item $installer.FullName (Join-Path $distDir "Luma-per-Tapo-v1.02-setup.exe") -Force

          $appImage = Get-ChildItem -Path "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appImage) { throw "App image non trovata in desktop/build/compose/binaries/main/app" }
          Compress-Archive -Path (Join-Path $appImage.FullName "*") -DestinationPath (Join-Path $distDir "Luma-per-Tapo-v1.02-windows-portable.zip") -Force

          Get-ChildItem $distDir | Select-Object Name, @{ N = "SizeMB"; E = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Carica artefatti Windows come Artifact di GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Luma-per-Tapo-v1.02-Windows
          path: |
            dist/Luma-per-Tapo-v1.02-setup.exe
            dist/Luma-per-Tapo-v1.02-windows-portable.zip
          if-no-files-found: error

      - name: Pubblica Windows nelle Release di GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.02' }}
          name: "Luma per Tapo v1.02 — Porting Nativo Windows & LAN Discovery"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            dist/Luma-per-Tapo-v1.02-setup.exe
            dist/Luma-per-Tapo-v1.02-windows-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
