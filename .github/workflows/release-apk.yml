name: Build APK & Publish GitHub Release v1.01

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag della Release GitHub (es. v1.01)"
        required: false
        default: "v1.01"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compila APK Android & Pubblica Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configura Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: Accetta licenze Android SDK e installa Build-Tools 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configura Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepara Keystore di firma e file .env
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Compila APK Release e Debug firmati
        run: |
          gradle :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Prepara file APK per la Release v1.01
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Luma-per-Tapo-v1.01-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Luma-per-Tapo-v1.01-debug.apk
          ls -lh dist/

      - name: Carica APK come Artifact di GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Luma-per-Tapo-v1.01-APK
          path: |
            dist/Luma-per-Tapo-v1.01-release.apk
            dist/Luma-per-Tapo-v1.01-debug.apk
          if-no-files-found: error

      - name: Pubblica APK nelle Release di GitHub (v1.01)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.01' }}
          name: "Luma per Tapo v1.01 — Widget Home & 120Hz"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            dist/Luma-per-Tapo-v1.01-release.apk
            dist/Luma-per-Tapo-v1.01-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
